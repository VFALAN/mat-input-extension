<div class="container">
  <div class="form-container">
    <form [formGroup]="form">
      <div class="controls-container">
        <div class="controls">
          <mat-form-field>
            <mat-label>File</mat-label>
            <mat-input-file formControlName="file"></mat-input-file>
          </mat-form-field>
        </div>
        <div class="controls">
          <mat-form-field>
            <mat-label>Picture</mat-label>
            <mat-picture-input [enabledPreview]="true" [enabledDownload]="true" formControlName="picture"></mat-picture-input>
          </mat-form-field>
        </div>
      </div>

    </form>
  </div>
</div>
